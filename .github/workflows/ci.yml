name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Publishes a branch by hand, for verifying a deployment before merging.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: make check
      # Fails on a known high or critical advisory in the installed
      # dependencies, so that one is noticed when it is published rather than
      # when it is exploited. Kept out of make check, which works offline.
      - run: pnpm audit --audit-level=high

  # Publishes the web app to GitHub Pages. See docs/guides/deployment.md.
  deploy:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: make deps
      - run: pnpm --filter @yagura/web build
        env:
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_YAGURA_SESSION_API: ${{ vars.VITE_YAGURA_SESSION_API }}
      # GitHub Pages serves 404.html for any path it has no file for. As a
      # copy of index.html it loads the app there too, which is how the
      # sign-in redirect to /callback reaches the app.
      # mockServiceWorker.js is used only with VITE_API_MOCK=1 in development
      # (see docs/guides/development.md), so it is left out of the site.
      - name: Prepare the site
        working-directory: packages/apps/web/dist
        run: |
          cp index.html 404.html
          rm mockServiceWorker.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: packages/apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
