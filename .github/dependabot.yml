# The workflows pin actions to commit SHAs, so that a moved tag cannot change
# what runs. Dependabot proposes the updates that a tag would have brought.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # pnpm workspaces share the lockfile at the root, so one entry covers every
  # package. Minor and patch updates come as one pull request to keep the
  # weekly volume low; a major update gets its own, since it may need code
  # changes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # react and react-dom must be on the same version, and their type
      # packages follow them, so a major update to one alone cannot pass.
      # Listed first: a dependency goes to the first group that matches.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [major, minor, patch]
      minor-and-patch:
        update-types: [minor, patch]
    # MSW 3 makes the web tests fail when several runs share a machine: its
    # Node interceptor picks handlers later than MSW 2, which widens races in
    # the tests' waits. Stay on MSW 2 until the tests are made robust to it,
    # then drop this entry.
    ignore:
      - dependency-name: msw
        update-types: ["version-update:semver-major"]
