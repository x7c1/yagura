# The workflows pin actions to commit SHAs, so that a moved tag cannot change
# what runs. Dependabot proposes the updates that a tag would have brought.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # pnpm workspaces share the lockfile at the root, so one entry covers every
  # package. Minor and patch updates come as one pull request to keep the
  # weekly volume low; a major update gets its own, since it may need code
  # changes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
